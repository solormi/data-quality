<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report SQL Reviewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    textarea {
      width: 100%;
      min-height: 220px;
      padding: 0.6rem;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #report {
      margin-top: 2rem;
      padding: 1rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px;
      min-height: 60px;
    }
    #report.error { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
    .hint { color: #6b7280; font-size: 0.85rem; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <h1>Report SQL Reviewer</h1>

  <form id="form">
    <div class="row">
      <div>
        <label for="sql">SQL</label>
        <textarea id="sql" placeholder="SELECT id, amount FROM orders WHERE ..."></textarea>
        <div class="hint">要审查的报表 SQL 全文</div>
      </div>
      <div>
        <label for="docs">需求文档 (Markdown)</label>
        <textarea id="docs" placeholder="# 口径定义
WHERE status = 'PAID'
...

# 数据特征
- amount: 折扣后金额(单位:分)
"></textarea>
        <div class="hint">包含口径定义、数据特征、已知问题等</div>
      </div>
    </div>
    <button type="submit" id="submit">审查</button>
  </form>

  <div id="report"></div>

  <script>
    const form = document.getElementById('form');
    const submit = document.getElementById('submit');
    const reportEl = document.getElementById('report');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const sql = document.getElementById('sql').value;
      const docs = document.getElementById('docs').value;

      if (!sql.trim() || !docs.trim()) {
        reportEl.className = 'error';
        reportEl.textContent = '错误:SQL 和需求文档都要填';
        return;
      }

      submit.disabled = true;
      submit.textContent = '审查中...';
      reportEl.className = '';
      reportEl.textContent = '等待 LLM 响应(可能需要 10-30 秒)...';

      try {
        const resp = await fetch('/api/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sql, docs }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          reportEl.className = 'error';
          reportEl.textContent = `错误: ${data.error || resp.statusText}`;
          if (data.raw) reportEl.textContent += '\n\n--- 原始 LLM 输出 ---\n' + data.raw;
          return;
        }

        reportEl.className = '';
        reportEl.textContent = data.report || '(空报告)';
      } catch (err) {
        reportEl.className = 'error';
        reportEl.textContent = `网络错误: ${err.message}`;
      } finally {
        submit.disabled = false;
        submit.textContent = '审查';
      }
    });
  </script>
</body>
</html>
